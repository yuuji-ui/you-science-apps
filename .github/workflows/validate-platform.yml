name: Validate Platform

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "project-docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Run platform validation
        run: python platform/automation/tools/run-ci.py --repo .
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-validation-report
          path: |
            platform/automation/docs/ci-report.json
            platform/automation/docs/catalog-generation-report.json
          if-no-files-found: ignore
          retention-days: 14
