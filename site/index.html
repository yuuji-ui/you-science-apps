<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>You Science Apps</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--soft:#eef3f8;--text:#15202b;--muted:#52606d;--line:#cbd5df;--accent:#155eef;--accent2:#0b45b5;--warn:#fff7d6;--warntext:#6b4f00;--radius:18px;--shadow:0 8px 24px rgba(21,32,43,.08);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101418;--surface:#182028;--soft:#202a34;--text:#f4f7fa;--muted:#b7c2cc;--line:#3d4b59;--accent:#78a7ff;--accent2:#a9c6ff;--warn:#4a3c00;--warntext:#fff1a8;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}a{color:inherit}button,input,select{font:inherit;min-height:48px}.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:var(--surface);padding:.8rem;z-index:10}header{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;padding:2.4rem 1rem 3rem}.wrap{max-width:1180px;margin:auto}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 .5rem}header p{max-width:760px;margin:0}main{padding:1.5rem 1rem 4rem}.panel,.card,.empty,.error{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:1rem;margin-top:-2rem}.controls{display:grid;grid-template-columns:2fr repeat(3,minmax(150px,1fr));gap:.8rem}label{display:grid;gap:.35rem;font-weight:700}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;background:var(--surface);color:var(--text)}input:focus,select:focus,button:focus,a:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}.summary{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.4rem 0 .8rem}.reset{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:.65rem 1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}.card{padding:1.1rem;display:flex;flex-direction:column;gap:.75rem}.card h3{margin:0;font-size:1.25rem}.meta,.badges{display:flex;gap:.45rem;flex-wrap:wrap}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:.18rem .55rem;font-size:.82rem;background:var(--soft)}.goal{margin:0;color:var(--muted)}.deprecated{background:var(--warn);color:var(--warntext);border-radius:12px;padding:.7rem;font-weight:700}.footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.7rem}.open{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.65rem 1rem;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:800}.open:hover{background:var(--accent2)}.version{color:var(--muted);font-size:.88rem}.empty,.error{padding:1.2rem}.section-title{margin:1.7rem 0 .8rem}[hidden]{display:none!important}footer{padding:2rem 1rem;text-align:center;color:var(--muted)}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:560px){.controls{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">教材一覧へ移動</a>
<header><div class="wrap"><h1>You Science Apps</h1><p>中学校理科・高校化学の授業、家庭学習、宿題で使える教育用Webアプリ集です。ログインや個人情報の登録は必要ありません。</p></div></header>
<main id="main" class="wrap">
<section class="panel" aria-labelledby="search-title">
<h2 id="search-title">教材を探す</h2>
<p>キーワードや学年、教科、教材形式で絞り込めます。</p>
<div class="controls">
<label>キーワード<input id="search" type="search" placeholder="教材名・単元・学習内容"></label>
<label>学年<select id="grade"><option value="">すべて</option></select></label>
<label>教科<select id="subject"><option value="">すべて</option></select></label>
<label>教材形式<select id="type"><option value="">すべて</option></select></label>
</div>
</section>
<div class="summary" aria-live="polite"><strong id="count">読み込み中です…</strong><button id="reset" class="reset" type="button">条件をリセット</button></div>
<section id="featured-section" aria-labelledby="featured-title"><h2 id="featured-title" class="section-title">おすすめ教材</h2><div id="featured-grid" class="grid"></div></section>
<section aria-labelledby="all-title"><h2 id="all-title" class="section-title">すべての教材</h2><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>条件に合う教材はありません。</div><div id="error" class="error" hidden><strong>教材一覧を読み込めませんでした。</strong><p>ページを再読み込みしてください。</p></div></section>
</main>
<footer>広告・アクセス解析・不要なCookieは使用していません。</footer>
<script>
(()=>{"use strict";
const L={grades:{JH1:"中1",JH2:"中2",JH3:"中3",SH1:"高1",SH2:"高2",SH3:"高3",other:"その他"},subjects:{science:"中学理科",chemistry:"化学",physics:"物理",biology:"生物","earth-science":"地学"},types:{calculation:"計算",simulation:"シミュレーション",drag:"ドラッグ",experiment:"実験",visualization:"可視化",quiz:"クイズ",reference:"資料"},status:{active:"公開中",maintenance:"保守中",deprecated:"旧版"}};
const E={search:document.querySelector("#search"),grade:document.querySelector("#grade"),subject:document.querySelector("#subject"),type:document.querySelector("#type"),reset:document.querySelector("#reset"),count:document.querySelector("#count"),featuredSection:document.querySelector("#featured-section"),featuredGrid:document.querySelector("#featured-grid"),grid:document.querySelector("#grid"),empty:document.querySelector("#empty"),error:document.querySelector("#error")};let apps=[];
const label=(g,v)=>L[g][v]||v;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fill(s,vals,g){[...vals].sort((a,b)=>label(g,a).localeCompare(label(g,b),"ja")).forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=label(g,v);s.append(o)})}
function card(a){const el=document.createElement("article");el.className="card";const badges=[...(a.grades||[]).map(v=>label("grades",v)),...(a.subjects||[]).map(v=>label("subjects",v)),...(a.appTypes||[]).map(v=>label("types",v))];const dep=a.status==="deprecated"&&a.deprecatedMessage?`<div class="deprecated">${esc(a.deprecatedMessage)}</div>`:"";el.innerHTML=`<div class="meta"><span class="badge">${esc(label("status",a.status))}</span><span class="badge">Level ${esc(a.level||"-")}</span></div><h3>${esc(a.title)}</h3><div class="badges">${badges.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</div><p class="goal">${esc((a.learningGoals||[])[0]||"学習目標は準備中です。")}</p>${dep}<div class="footer"><span class="version">Ver. ${esc(a.version)}</span>${a.hostedUrl?`<a class="open" href="${esc(a.hostedUrl)}">教材を開く</a>`:`<span class="badge">公開準備中</span>`}</div>`;return el}
function matches(a){const q=E.search.value.trim().toLocaleLowerCase("ja");const text=[a.title,...(a.learningGoals||[]),...(a.units||[]),...(a.labels||[])].join(" ").toLocaleLowerCase("ja");return(!q||text.includes(q))&&(!E.grade.value||(a.grades||[]).includes(E.grade.value))&&(!E.subject.value||(a.subjects||[]).includes(E.subject.value))&&(!E.type.value||(a.appTypes||[]).includes(E.type.value))}
function render(){const f=apps.filter(matches),feat=f.filter(a=>a.featured);E.featuredGrid.replaceChildren(...feat.map(card));E.featuredSection.hidden=!feat.length;E.grid.replaceChildren(...f.map(card));E.empty.hidden=!!f.length;E.count.textContent=`${f.length}件の教材を表示しています`}
async function init(){try{const r=await fetch("./catalog/catalog.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);const c=await r.json();apps=(c.apps||[]).filter(a=>!a.hidden);fill(E.grade,new Set(apps.flatMap(a=>a.grades||[])),"grades");fill(E.subject,new Set(apps.flatMap(a=>a.subjects||[])),"subjects");fill(E.type,new Set(apps.flatMap(a=>a.appTypes||[])),"types");render()}catch(e){console.error(e);E.count.textContent="教材一覧を読み込めませんでした";E.featuredSection.hidden=true;E.grid.hidden=true;E.error.hidden=false}}
[E.search,E.grade,E.subject,E.type].forEach(x=>x.addEventListener("input",render));E.reset.addEventListener("click",()=>{E.search.value="";E.grade.value="";E.subject.value="";E.type.value="";render();E.search.focus()});init();
})();
</script>
</body></html>
