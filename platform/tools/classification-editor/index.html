<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>You Science Apps タグ・分類編集ツール</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f4f7fb;--surface:#fff;--text:#17202a;--muted:#52606d;--line:#cbd5df;--accent:#155eef;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.6}
main{max-width:1100px;margin:auto;padding:20px}h1{margin-top:0}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;font-weight:700}
input,select,textarea,button{font:inherit;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:100px}.full{grid-column:1/-1}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px}.checks input{min-height:auto}
button{background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.secondary{background:#fff;color:var(--text)}.danger{border-color:var(--danger);color:var(--danger);background:#fff}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;color:#f9fafb;padding:14px;border-radius:12px;max-height:440px;overflow:auto}
.note{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:800}.error{color:var(--danger)}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>タグ・分類編集ツール</h1>
<p class="note">Manifestの大分類・対象・単元・タグだけを安全に更新します。その他の設定は保持します。</p>
<section class="panel"><h2>1. Manifestを貼り付ける</h2><label>app.manifest.json全文<textarea id="source"></textarea></label><button id="load" type="button">読み込む</button><p id="status" class="status"></p></section>
<section class="panel"><h2>2. 分類を編集</h2><div class="grid">
<label>大分類ID（カンマ区切り）<input id="portalGroups"></label>
<label>対象ID（カンマ区切り）<input id="audiences"></label>
<label>単元（カンマ区切り）<input id="categories"></label>
<label>タグ（カンマ区切り）<input id="tags"></label>
</div><p class="note">中学校対象: JH1 / JH2 / JH3。高校対象: physics-basic / physics / chemistry-basic / chemistry / biology-basic / biology / earth-science-basic / earth-science / other。</p></section>
<section class="panel"><button id="generate" type="button">更新Manifestを生成</button></section>
<section class="panel"><div class="actions"><button class="secondary" data-copy="output">コピー</button></div><pre id="output">未生成</pre></section>
</main><script src="./classification-core.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id);let current=null;
$("load").addEventListener("click",()=>{const r=YSAClassCore.parse($("source").value);if(!r.ok){$("status").textContent=r.errors.join(" ");$("status").className="status error";return}
current=r.manifest;$("status").textContent=`${current.title||current.appId}を読み込みました。`;$("status").className="status";
$("portalGroups").value=(current.education?.portalGroups||[]).join(", ");$("audiences").value=(current.education?.audiences||[]).join(", ");
$("categories").value=(current.education?.categories||[]).join(", ");$("tags").value=(current.education?.tags||[]).join(", ");
});
$("generate").addEventListener("click",()=>{if(!current){alert("Manifestを読み込んでください。");return}const r=YSAClassCore.apply(current,{
portalGroups:$("portalGroups").value,audiences:$("audiences").value,categories:$("categories").value,tags:$("tags").value});
if(!r.ok){alert(r.errors.join("\n"));return}$("output").textContent=JSON.stringify(r.manifest,null,2);});
document.querySelector("[data-copy]").addEventListener("click",async e=>{await navigator.clipboard.writeText($("output").textContent);e.target.textContent="コピー済み";setTimeout(()=>e.target.textContent="コピー",1200);});
})();</script></body></html>
